<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fintro v2 — Lernen</title>
<meta name="description" content="Fintro — Finanzbildung für Jugendliche, Schritt für Schritt." />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/design.css" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<style>
  body{padding-bottom:5rem}
  .app{max-width:var(--readw);margin:0 auto;padding:1.6rem 1.5rem}
  .tabs{margin-bottom:1.6rem}
  .backbar{display:flex;align-items:center;gap:.8rem;margin-bottom:1.2rem}
  .foot-note{margin-top:1.4rem;text-align:center;font-family:var(--font-display);font-size:.7rem;color:var(--faint)}
</style>
</head>
<body>

<header class="statusbar">
  <div class="inner">
    <a class="logo" href="#" id="home-link">fin<span>tro</span></a>
    <span class="sp"></span>
    <span>XP <b id="xp">0</b></span>
    <span class="up" id="streak">0🔥</span>
  </div>
  <div class="progressbar"><i id="prog" style="width:0%"></i></div>
</header>

<!-- HOME -->
<main class="app screen active" id="home-screen">
  <div class="home-hero">
    <h1>Willkommen zurück.</h1>
    <p>Echte Finanzen, Schritt für Schritt. Mach da weiter, wo du aufgehört hast.</p>
  </div>
  <div class="stats-row">
    <div class="stat-card"><span class="v" id="st-done">0</span><span class="l">Kapitel fertig</span></div>
    <div class="stat-card"><span class="v" id="st-xp">0</span><span class="l">XP gesamt</span></div>
    <div class="stat-card"><span class="v" id="st-streak">0🔥</span><span class="l">Tage-Streak</span></div>
  </div>
  <div id="units"></div>
</main>

<!-- KAPITEL -->
<main class="app screen" id="chapter-screen">
  <div class="backbar">
    <button class="btn-ghost" id="back-btn" style="padding:.5rem 1rem;font-size:.86rem">← Übersicht</button>
    <span class="lesson-meta" id="ch-meta"></span>
  </div>
  <h1 class="lesson-title" id="ch-title"></h1>
  <div class="lesson-sub" id="ch-sub"></div>

  <div class="tabs" role="tablist" aria-label="Kapitel-Bereiche" id="tabs"></div>

  <div class="tab-panel active" id="panel-lesson"></div>
  <div class="tab-panel" id="panel-vocab"></div>
  <div class="tab-panel" id="panel-quiz"></div>
  <div class="tab-panel" id="panel-game"></div>

  <div class="foot-note">Fintro v2 · datengetrieben · Schritt-für-Schritt · interaktive Charts</div>
</main>

<script>
/* ════════════ DATEN ════════════ */
const UNITS = [
  {n:1, name:"Das Fundament — Wie Geld wirklich funktioniert", ch:[1,2,3]},
  {n:2, name:"Management — Budgetierung, Banking & Schulden", ch:[4,5,6,7]},
  {n:3, name:"Schutz — Steuern, Versicherung & Risiko", ch:[8,9,10,11]},
  {n:4, name:"Wachstum — Investieren & Vermögen aufbauen", ch:[12,13,14,15]},
  {n:5, name:"Das grosse Bild — Leben & Geld", ch:[16,17,18,19]},
];
const META = {
  1:{t:"Was ist Geld?", s:"Von Muscheln bis Smartphones", xp:200},
  2:{t:"Zinseszins", s:"Die stille Kraft hinter Vermögen", xp:250},
  3:{t:"Einkommen & Verdienen", s:"Woher Geld kommt", xp:200},
  4:{t:"Budgetierung", s:"Sag deinem Geld, wohin", xp:200},
  5:{t:"Banking & Konten", s:"Wie Banken wirklich funktionieren", xp:200},
  6:{t:"Schulden & Kreditkarten", s:"Wann Schulden sinnvoll sind", xp:250},
  7:{t:"Notfallpuffer", s:"Dein finanzielles Sicherheitsnetz", xp:200},
  8:{t:"Steuern erklärt", s:"Wohin dein Geld geht", xp:250},
  9:{t:"Versicherungs-Grundlagen", s:"Was du brauchst, was nicht", xp:200},
  10:{t:"Risiko & dein Geld", s:"Was Risiko wirklich bedeutet", xp:200},
  11:{t:"Betrug & Sicherheit", s:"Wie Betrüger denken", xp:250},
  12:{t:"Aktien & ETFs", s:"Die Unternehmen der Welt besitzen", xp:250},
  13:{t:"Immobilien", s:"Steine, Hypotheken, Kaufen vs. Mieten", xp:250},
  14:{t:"Anleger-Psychologie", s:"Dein grösster Feind bist du selbst", xp:250},
  15:{t:"Krypto & Risiko", s:"Was Krypto wirklich ist", xp:200},
  16:{t:"Unternehmertum", s:"Etwas aufbauen, und wie das Geld läuft", xp:250},
  17:{t:"Globale Wirtschaft", s:"Wie Länder & Währungen dein Geld prägen", xp:200},
  18:{t:"Deine finanzielle Zukunft", s:"Wie finanzielle Freiheit wirklich aussieht", xp:250},
  19:{t:"Psychologie des Geldes", s:"Warum wir tun, was wir tun", xp:250},
};
/* Volle Kapiteldaten — aktuell Kapitel 2 als Vorlage. Weitere folgen (nur Daten). */
const CHAPTERS = {
  2:{
    steps:[
      {phase:"Erklärung", title:"Was ist Zinseszins?",
       lead:"Du legst CHF 1.000 an, 8 % im Jahr. Macht CHF 80. Klar. Jetzt die Frage, auf die alles ankommt: Wo landen diese 80 Franken?",
       blocks:[
         {type:"def", html:"<b>Zinseszins</b> = Zinsen auf dein Kapital UND auf die Zinsen, die du schon verdient hast. Dein Geld verdient Geld auf sich selbst."},
         {type:"two", items:[
           {cls:"s", t:"Einfacher Zins", p:"Die 80 bleiben separat. Jedes Jahr wieder 8 % von 1.000 = 80. Die Basis wächst nie."},
           {cls:"c", t:"Zinseszins", p:"Die 80 kommen dazu. Nächstes Jahr 8 % von 1.080. Die Basis wächst jedes Jahr. Das ist der Schneeball."}
         ]}
       ]},
      {phase:"Vertiefung", title:"Wie schnell wächst es wirklich?",
       lead:"Gleicher Einsatz, gleicher Zins. Einziger Unterschied: bleiben die Zinsen liegen oder nicht? Zieh an den Reglern und schau, wie weit die Kurven auseinanderlaufen.",
       blocks:[
         {type:"compoundChart"},
         {type:"take", html:"Nach 30 Jahren bringt Zinseszins oft das <b>Fünffache</b> des einfachen Zinses. Nur weil die Zinsen liegen bleiben und selbst Zinsen verdienen."}
       ]},
      {phase:"Kontext", title:"Im echten Leben",
       lead:"Das ist nicht nur Theorie. Zinseszins entscheidet, wie viel du mit 60 hast. Und er läuft in beide Richtungen.",
       blocks:[
         {type:"statCompare", lab:"Früh vs. spät · CHF 200/Monat bei 7 %",
          a:{v:"~CHF 680k", s:"Alex startet mit 17"}, b:{v:"~CHF 370k", s:"Jordan startet mit 27"},
          note:"10 Jahre Vorsprung, fast doppelt so viel mit 60. Gleicher Betrag, gleicher Zins. Die Jahre holst du nie wieder auf."},
         {type:"note", k:"Andere Richtung", html:"Dieselbe Kraft frisst dich, wenn du Schulden hast. Kreditkarte mit 20 % Zinsen: aus CHF 1.000 werden in 5 Jahren CHF 2.500. Lektion: immer voll zahlen."}
       ]},
      {phase:"Erkenntnisse", title:"3 Dinge zum Merken",
       blocks:[
         {type:"insights", items:[
           {n:"1", t:"Zinseszins schlägt einfachen Zins, aber erst mit Zeit.", p:"Im ersten Jahr kaum ein Unterschied. Nach 30 Jahren das Fünffache. Geduld ist der ganze Trick."},
           {n:"2", t:"Schulden wachsen genauso.", p:"Gleiche Mathe, andere Richtung. Eine 20%-Kreditkarte nutzt exakt denselben Effekt wie dein Sparkonto, nur gegen dich."},
           {n:"★", key:true, t:"Zeit kannst du nicht zurückkaufen.", p:"Jedes Jahr, das du wartest, kostet mehr als das Jahr davor. Fang jetzt an, egal mit wie wenig."}
         ]}
       ]}
    ],
    vocab:[
      {term:"Kapital", def:"Der Geldbetrag, mit dem du startest, bevor Zinsen dazukommen. Dein Ausgangspunkt."},
      {term:"Zinssatz", def:"Wie viel Prozent pro Jahr dazukommen. 7 % auf CHF 1.000 sind CHF 70 im Jahr."},
      {term:"Zinseszins", def:"Zinsen auf dein Kapital UND auf schon verdiente Zinsen. Das macht das Wachstum exponentiell, nicht linear."},
      {term:"Einfacher Zins", def:"Zinsen nur auf den Startbetrag. CHF 1.000 bei 10 % bringen immer 100 im Jahr, nie mehr."},
      {term:"Zeitwert des Geldes", def:"Geld jetzt ist mehr wert als später, weil es wachsen kann. Deshalb zählt jedes Jahr."}
    ],
    quiz:[
      {q:"Was unterscheidet Zinseszins von einfachem Zins?", options:["Schneller zu berechnen","Zinsen verdienen selbst Zinsen","Gilt nur für Kredite","Ist immer niedriger"], correct:1, explain:"Beim Zinseszins kommen die Zinsen zur Basis dazu und verdienen ab dann selbst mit. Das ergibt exponentielles Wachstum."},
      {q:"CHF 500 bei 10 % einfachem Zins, 2 Jahre. Wie viel Zins?", options:["CHF 50","CHF 100","CHF 105","CHF 110"], correct:1, explain:"10 % von 500 = 50 pro Jahr. Über 2 Jahre also 100. Einfacher Zins rechnet immer vom Startbetrag."},
      {q:"Warum ist früh anfangen so stark?", options:["Zinssätze sind jung höher","Zeit verstärkt den Effekt","Gesetzlich vorgeschrieben","Inflation zählt dann nicht"], correct:1, explain:"Jedes Extrajahr legt eine multiplizierte Schicht drauf. Zeit ist die mächtigste Variable."},
      {q:"Wann arbeitet Zinseszins gegen dich?", options:["Wenn du sparst","Bei hochverzinsten Schulden","Bei niedrigen Zinsen","Bei Aktien"], correct:1, explain:"Eine Kreditkarte bei 20 % nutzt dieselbe Mathe, nur gegen dich. Schulden wachsen genauso schnell wie Ersparnisse."},
      {q:"Was bedeutet Zeitwert des Geldes?", options:["Geld verliert nachts an Wert","Geld jetzt ist mehr wert als später","Zeit kostet Geld","Alte Münzen sind wertvoll"], correct:1, explain:"Geld, das du heute hast, kann wachsen. Derselbe Betrag später hat diese Chance verpasst."}
    ]
  }
};

/* ════════════ STATE (lokal, kein Tracking) ════════════ */
let state = JSON.parse(localStorage.getItem("fintro_state")||"null") || {xp:0, completedChapters:[], streak:0, lastActiveDate:null};
const save = () => localStorage.setItem("fintro_state", JSON.stringify(state));
const dateStr = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayStr = () => dateStr(new Date());
const yesterdayStr = () => { const d=new Date(); d.setDate(d.getDate()-1); return dateStr(d); };
const currentStreak = () => !state.lastActiveDate ? 0 : (state.lastActiveDate===todayStr()||state.lastActiveDate===yesterdayStr() ? (state.streak||0) : 0);
function registerActivity(){ const t=todayStr(); if(state.lastActiveDate===t) return; state.streak = state.lastActiveDate===yesterdayStr() ? (state.streak||0)+1 : 1; state.lastActiveDate=t; save(); }

const el = id => document.getElementById(id);
const totalXP = Object.values(META).reduce((s,m)=>s+m.xp,0);

/* ════════════ HOME ════════════ */
function renderTopStats(){
  el("xp").textContent = state.xp.toLocaleString("de-CH");
  el("streak").textContent = "▲ " + currentStreak() + "🔥";
  el("prog").style.width = Math.min(100, state.xp/totalXP*100) + "%";
}
function renderHome(){
  renderTopStats();
  el("st-done").textContent = state.completedChapters.length;
  el("st-xp").textContent = state.xp.toLocaleString("de-CH");
  el("st-streak").textContent = currentStreak()+"🔥";
  el("units").innerHTML = UNITS.map(u=>`
    <div class="unit-block">
      <div class="unit-label">Unit ${String(u.n).padStart(2,"0")}</div>
      <div class="unit-name">${u.name}</div>
      ${u.ch.map(id=>{
        const m=META[id], done=state.completedChapters.includes(id), ready=!!CHAPTERS[id];
        const badge = done?'<span class="ch-badge done">✓ Fertig</span>' : ready?'<span class="ch-badge start">▶ Start</span>' : '<span class="ch-badge soon">bald</span>';
        return `<button class="chapter-row ${ready?'':'locked'}" ${ready?`data-open="${id}"`:'disabled'}>
          <span class="num">${String(id).padStart(2,"0")}</span>
          <span class="info"><b>${m.t}</b><span>${m.s}</span></span>
          <span class="xp">+${m.xp} XP</span>${badge}
        </button>`;
      }).join("")}
    </div>`).join("");
  el("units").querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openChapter(+b.dataset.open));
}

/* ════════════ KAPITEL ════════════ */
let currentId=null, curStep=0, totalSteps=0;
function openChapter(id){
  if(!CHAPTERS[id]) return;
  currentId=id; const m=META[id];
  el("ch-meta").textContent = `Unit ${String(unitOf(id)).padStart(2,"0")} · Kapitel ${String(id).padStart(2,"0")}`;
  el("ch-title").textContent = m.t;
  el("ch-sub").textContent = m.s;
  buildTabs();
  renderLesson(id); renderVocab(id); renderQuiz(id); renderGame(id);
  switchTab("lesson");
  show("chapter-screen");
}
const unitOf = id => UNITS.find(u=>u.ch.includes(id)).n;
function show(screen){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active", s.id===screen)); window.scrollTo(0,0); }
function goHome(){ renderHome(); show("home-screen"); }

const TAB_ICONS = {
  lesson:'<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11a1.5 1.5 0 0 1 1.5 1.5V20a1 1 0 0 0-1-1H5.5A1.5 1.5 0 0 1 4 17.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13a1.5 1.5 0 0 0-1.5 1.5V20a1 1 0 0 1 1-1h5.5a1.5 1.5 0 0 0 1.5-1.5z"/>',
  vocab:'<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M7 9h6M7 13h10"/>',
  quiz:'<path d="M4 12.5l4.5 4.5L20 6"/>',
  game:'<circle cx="12" cy="12" r="9"/><path d="M10 9l5 3-5 3z" fill="currentColor"/>'
};
const TAB_LABELS = {lesson:"Lektion", vocab:"Vokabeln", quiz:"Quiz", game:"Spiel"};
function buildTabs(){
  el("tabs").innerHTML = Object.keys(TAB_LABELS).map(k=>
    `<button class="tab" role="tab" data-tab="${k}" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${TAB_ICONS[k]}</svg>${TAB_LABELS[k]}</button>`
  ).join("");
  el("tabs").querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
}
function switchTab(name){
  document.querySelectorAll("#tabs .tab").forEach(t=>t.setAttribute("aria-selected", t.dataset.tab===name));
  document.querySelectorAll(".tab-panel").forEach(p=>p.classList.toggle("active", p.id==="panel-"+name));
  if(name==="lesson") setTimeout(maybeInitChart, 30);
}

/* ─── Lektion ─── */
function renderBlock(b){
  switch(b.type){
    case "def": return `<div class="def">${b.html}</div>`;
    case "two": return `<div class="two">${b.items.map(i=>`<div class="mini ${i.cls}"><div class="t">${i.t}</div><p>${i.p}</p></div>`).join("")}</div>`;
    case "take": return `<div class="take"><div><span class="k">Zum Merken</span>${b.html}</div></div>`;
    case "note": return `<div class="note-card"><span class="k">${b.k}</span>${b.html}</div>`;
    case "statCompare": return `<div class="statcard"><div class="lab">${b.lab}</div><div class="statrow"><div class="s win"><b>${b.a.v}</b><span>${b.a.s}</span></div><div class="s lose"><b>${b.b.v}</b><span>${b.b.s}</span></div></div><p style="font-size:.86rem;color:#4a5365;margin-top:.8rem">${b.note}</p></div>`;
    case "insights": return b.items.map(i=>`<div class="ins ${i.key?'key':''}"><div class="n">${i.n}</div><div class="t"><b>${i.t}</b><p>${i.p}</p></div></div>`).join("");
    case "compoundChart": return `
      <div class="chart-head"><div class="big" id="cc-final">CHF 0</div><div class="pill" id="cc-mult">× 0</div></div>
      <div id="cc-chart"></div>
      <div class="ctrls">
        <div class="ctrl"><label class="cl" for="cc-p"><span>Startbetrag</span><b id="cc-lp">CHF 1.000</b></label><input id="cc-p" type="range" min="500" max="20000" step="500" value="1000"></div>
        <div class="ctrl"><label class="cl" for="cc-r"><span>Zinssatz / Jahr</span><b id="cc-lr">8%</b></label><input id="cc-r" type="range" min="1" max="15" step="1" value="8"></div>
        <div class="ctrl" style="grid-column:1/-1"><label class="cl" for="cc-t"><span>Laufzeit</span><b id="cc-lt">30 Jahre</b></label><input id="cc-t" type="range" min="5" max="40" step="1" value="30"></div>
      </div>`;
    default: return "";
  }
}
function renderLesson(id){
  const steps = CHAPTERS[id].steps; totalSteps = steps.length; curStep = 0; ccChart = null;
  el("panel-lesson").innerHTML = steps.map((s,i)=>{
    const dots = steps.map((_,j)=>`<span class="dot ${j<i?'done':j===i?'on':''}"></span>`).join("");
    const last = i===totalSteps-1;
    return `<section class="step" data-step="${i}" ${i===0?'':'hidden'}>
      <div class="step-head"><span class="phase">${s.phase}</span><div class="dots">${dots}</div></div>
      <div class="step-body"><h2>${s.title}</h2>${s.lead?`<p class="lead">${s.lead}</p>`:""}${s.blocks.map(renderBlock).join("")}</div>
      <div class="step-nav">
        <button class="btn-text" data-back ${i===0?'style="visibility:hidden"':''}>← Zurück</button>
        <span class="step-count">Schritt ${i+1} / ${totalSteps}</span>
        <button class="btn btn-primary" data-next>${last?'Zum Quiz →':'Weiter →'}</button>
      </div>
    </section>`;
  }).join("");
  el("panel-lesson").querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>{ if(curStep<totalSteps-1) lessonStep(curStep+1); else switchTab("quiz"); });
  el("panel-lesson").querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{ if(curStep>0) lessonStep(curStep-1); });
}
function lessonStep(i){
  curStep=i;
  el("panel-lesson").querySelectorAll(".step").forEach(s=>s.hidden = (+s.dataset.step!==i));
  maybeInitChart();
  window.scrollTo({top:0, behavior:"smooth"});
}
function maybeInitChart(){
  const c = el("cc-chart");
  if(c && !ccChart && c.offsetParent !== null) initCompoundChart();
}

/* ─── Vokabeln ─── */
function renderVocab(id){
  const v = CHAPTERS[id].vocab;
  el("panel-vocab").innerHTML = `<div class="vocab-grid">` + v.map((x,i)=>
    `<button class="vocab-card" data-v="${i}"><div class="term"><span class="ix">${"ABCDE"[i]}</span>${x.term}</div><div class="def">${x.def}</div><div class="hint">tippen zum Aufdecken</div></button>`
  ).join("") + `</div>`;
  el("panel-vocab").querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>b.classList.toggle("open"));
}

/* ─── Quiz ─── */
let quiz = {i:0, score:0, answered:false, done:false, order:null};
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function renderQuiz(id){
  quiz = {i:0, score:0, answered:false, done:false,
    order: CHAPTERS[id].quiz.map(q=>{ const idx=shuffle([0,1,2,3]); return {opts:idx.map(k=>q.options[k]), correct:idx.indexOf(q.correct)}; }) };
  drawQuiz(id);
}
function drawQuiz(id){
  const qs = CHAPTERS[id].quiz, p = el("panel-quiz");
  if(quiz.done){
    const pct = Math.round(quiz.score/qs.length*100);
    p.innerHTML = `<div class="quiz-result"><span class="score">${quiz.score}/${qs.length}</span>
      <h3>${pct>=80?'Stark!':pct>=60?'Solide.':'Weiter üben.'}</h3>
      <p>${pct>=80?'Du hast das Kapitel drauf.':'Schau die Lektion nochmal an und probier\'s nochmal.'}</p>
      <button class="btn btn-primary" id="to-game">Zum Spiel →</button>
      ${pct<80?'<br><br><button class="btn-text" id="retry">Quiz wiederholen</button>':''}</div>`;
    el("to-game").onclick=()=>switchTab("game");
    if(el("retry")) el("retry").onclick=()=>renderQuiz(id);
    return;
  }
  const o = quiz.order[quiz.i], q = qs[quiz.i];
  p.innerHTML = `<div class="quiz">
    <div class="quiz-top"><span class="quiz-pill">${quiz.i+1} / ${qs.length}</span><span class="quiz-pill score">${quiz.score} richtig</span></div>
    <div class="quiz-q"><div class="qlabel">Frage ${quiz.i+1}</div><div class="qtext">${q.q}</div></div>
    <div class="quiz-opts">${o.opts.map((opt,k)=>`<button class="quiz-opt" data-k="${k}"><span class="ltr">${"ABCD"[k]}</span>${opt}</button>`).join("")}</div>
    <div class="quiz-fb" id="qfb"></div>
    <button class="btn btn-primary" id="qnext" style="display:none">Weiter →</button>
  </div>`;
  p.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>answerQuiz(id, +b.dataset.k));
}
function answerQuiz(id, k){
  if(quiz.answered) return; quiz.answered=true;
  const qs = CHAPTERS[id].quiz, o = quiz.order[quiz.i], q = qs[quiz.i];
  const opts = el("panel-quiz").querySelectorAll(".quiz-opt");
  opts.forEach(b=>b.disabled=true);
  opts[k].classList.add(k===o.correct?"correct":"wrong");
  opts[o.correct].classList.add("correct");
  const ok = k===o.correct; if(ok) quiz.score++;
  const fb = el("qfb"); fb.className = "quiz-fb show " + (ok?"correct":"wrong");
  fb.innerHTML = `<span class="k">${ok?'✓ Richtig':'✗ Nicht ganz'}</span>${q.explain}`;
  const nx = el("qnext"); nx.style.display="inline-flex";
  nx.onclick=()=>{ quiz.i++; quiz.answered=false; if(quiz.i>=qs.length){ quiz.done=true; finishChapter(id); } drawQuiz(id); };
}
function finishChapter(id){
  registerActivity();
  if(!state.completedChapters.includes(id)){ state.completedChapters.push(id); state.xp += META[id].xp; save(); }
  renderTopStats();
}

/* ─── Interaktiver Zinseszins-Chart ─── */
const fmt = n => "CHF " + Math.round(n).toLocaleString("de-CH");
let ccChart=null, ccPrev=0, ccRaf=null;
function ccSeries(){
  const P=+el("cc-p").value, r=+el("cc-r").value/100, t=+el("cc-t").value;
  el("cc-lp").textContent="CHF "+P.toLocaleString("de-CH"); el("cc-lr").textContent=(r*100).toFixed(0)+"%"; el("cc-lt").textContent=t+" Jahre";
  const N=Math.max(80,t*6), comp=[], simp=[];
  for(let i=0;i<=N;i++){ const x=t*i/N; comp.push({x:x,y:P*Math.pow(1+r,x)}); simp.push({x:x,y:P*(1+r*x)}); }
  return {comp,simp};
}
function ccCountUp(target){ const s=ccPrev,t0=performance.now(); (function step(now){ const k=Math.min(1,(now-t0)/650),e=1-Math.pow(1-k,3); el("cc-final").innerHTML=fmt(s+(target-s)*e)+' <small>Endkapital</small>'; if(k<1)requestAnimationFrame(step); })(performance.now()); ccPrev=target; }
function ccUpdate(anim){
  const {comp,simp}=ccSeries();
  ccChart.updateSeries([{name:"Zinseszins",data:comp},{name:"Einfacher Zins",data:simp}],false);
  const cf=comp[comp.length-1].y, sf=simp[simp.length-1].y;
  if(anim) ccCountUp(cf); else { el("cc-final").innerHTML=fmt(cf)+' <small>Endkapital</small>'; ccPrev=cf; }
  el("cc-mult").textContent="× "+(cf/sf).toFixed(1)+" vs. einfach";
}
function initCompoundChart(){
  if(ccChart) return; ccPrev=0;
  ccChart=new ApexCharts(el("cc-chart"),{
    chart:{type:"area",height:270,fontFamily:"Inter,sans-serif",toolbar:{show:false},animations:{enabled:false}},
    series:[{name:"Zinseszins",data:[]},{name:"Einfacher Zins",data:[]}],
    colors:["#10b981","#c3cad6"], stroke:{curve:"straight",width:[3.5,2]},
    fill:{type:["gradient","solid"],opacity:[1,0],gradient:{shadeIntensity:.4,opacityFrom:.3,opacityTo:.02,stops:[0,95]}},
    markers:{size:0,hover:{size:0}},
    xaxis:{type:"numeric",tickAmount:6,decimalsInFloat:0,labels:{formatter:v=>"J"+Math.round(v),style:{colors:"#8b95a6",fontFamily:"Space Grotesk",fontSize:"11px"}},axisBorder:{show:false},axisTicks:{show:false}},
    yaxis:{labels:{formatter:v=>v>=1000?Math.round(v/1000)+"k":Math.round(v),style:{colors:"#8b95a6",fontFamily:"Space Grotesk",fontSize:"11px"}}},
    grid:{borderColor:"#0c132212",strokeDashArray:4,padding:{left:6,right:6,top:0}},
    legend:{position:"top",horizontalAlign:"right",fontFamily:"Space Grotesk",fontSize:"12px",labels:{colors:"#5a6678"},markers:{radius:4}},
    dataLabels:{enabled:false},
    tooltip:{theme:"light",style:{fontFamily:"Space Grotesk",fontSize:"12px"},x:{formatter:v=>"Jahr "+Math.round(v)},y:{formatter:v=>fmt(v)}}
  });
  ccChart.render();
  ["cc-p","cc-r","cc-t"].forEach(id=>el(id).addEventListener("input",()=>{ if(ccRaf)return; ccRaf=requestAnimationFrame(()=>{ ccRaf=null; ccUpdate(false); }); }));
  setTimeout(()=>ccUpdate(true),120);
}

el("back-btn").onclick = goHome;
renderHome();
